<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .gradient-custom {
            /* fallback for old browsers */
            background: #f093fb;

            /* Chrome 10-25, Safari 5.1-6 */
            background: -webkit-linear-gradient(to bottom right, rgba(240, 147, 251, 1), rgba(245, 87, 108, 1));

            /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */
            background: linear-gradient(to bottom right, rgba(240, 147, 251, 1), rgba(245, 87, 108, 1))
        }

        .card-registration .select-input.form-control[readonly]:not([disabled]) {
            font-size: 1rem;
            line-height: 2.15;
            padding-left: .75em;
            padding-right: .75em;
        }

        .card-registration .select-arrow {
            top: 13px;
        }
    </style>
    <title>Document</title>
</head>

<body>
    <div id="carouselExampleDark" class="carousel carousel-dark slide">
        <div class="carousel-indicators">
            <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="0" class="active"
                aria-current="true" aria-label="Slide 1"></button>
            <button type="button" data-bs-target="#carouselExampleDark" data-bs-slide-to="1"
                aria-label="Slide 2"></button>
        </div>
        <div class="carousel-inner">
            <div class="carousel-item active" data-bs-interval="10000">
                <section class="vh-100 gradient-custom">
                    <div class="container py-5 h-100">
                        <div class="row justify-content-center align-items-center h-100">
                            <div class="col-12 col-lg-9 col-xl-7">
                                <div class="card shadow-2-strong card-registration" style="border-radius: 15px;">
                                    <div class="card-body p-4 p-md-5">
                                        <h3 class="mb-4 pb-2 pb-md-0 mb-md-5">Registration Form</h3>
                                        <form>

                                            <div class="row">
                                                <div class="col-md-6 mb-4">

                                                    <div data-mdb-input-init class="form-outline">
                                                        <input type="text" id="firstName"
                                                            class="form-control form-control-lg" />
                                                        <label class="form-label" for="firstName">First Name</label>
                                                    </div>

                                                </div>
                                                <div class="col-md-6 mb-4">

                                                    <div data-mdb-input-init class="form-outline">
                                                        <input type="text" id="lastName"
                                                            class="form-control form-control-lg" />
                                                        <label class="form-label" for="lastName">Last Name</label>
                                                    </div>

                                                </div>
                                            </div>

                                            <div class="row">
                                                <div class="col-md-6 mb-4 d-flex align-items-center">

                                                    <div data-mdb-input-init class="form-outline datepicker w-100">
                                                        <input type="date" class="form-control form-control-lg"
                                                            id="birthdayDate" />
                                                        <label for="birthdayDate" class="form-label">Birthday</label>
                                                    </div>

                                                </div>
                                                <div class="col-md-6 mb-4">

                                                    <h6 class="mb-2 pb-1">Gender: </h6>

                                                    <div class="form-check form-check-inline">
                                                        <input class="form-check-input" type="radio"
                                                            name="inlineRadioOptions" id="femaleGender" value="Nữ"
                                                            checked />
                                                        <label class="form-check-label"
                                                            for="femaleGender">Female</label>
                                                    </div>

                                                    <div class="form-check form-check-inline">
                                                        <input class="form-check-input" type="radio"
                                                            name="inlineRadioOptions" id="maleGender" value="Nam" />
                                                        <label class="form-check-label" for="maleGender">Male</label>
                                                    </div>

                                                </div>
                                            </div>
                                            <div class="row">
                                                <div class="col-md-6 mb-4 pb-2">
                                                    <div data-mdb-input-init class="form-outline">
                                                        <input type="email" id="emailAddress"
                                                            class="form-control form-control-lg" />
                                                        <label class="form-label" for="emailAddress">Email</label>
                                                    </div>
                                                </div>
                                                <div class="col-md-6 mb-4 pb-2">
                                                    <div data-mdb-input-init class="form-outline">
                                                        <input type="tel" id="phoneNumber"
                                                            class="form-control form-control-lg" />
                                                        <label class="form-label" for="phoneNumber">Phone Number</label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="row">
                                                <div data-mdb-input-init class="form-outline">
                                                    <textarea type="email" id="address"
                                                        class="form-control form-control-lg"></textarea>
                                                    <label class="form-label" for="address">Địa chỉ</label>
                                                </div>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <div class="carousel-caption d-none d-md-block">
                </div>
            </div>
            <div class="carousel-item" data-bs-interval="2000">
                <section class="vh-100 gradient-custom">
                    <div class="container py-5 h-100">
                        <div class="row justify-content-center align-items-center h-100">
                            <div class="col-12 col-lg-9 col-xl-7">
                                <div class="card shadow-2-strong card-registration" style="border-radius: 15px;">
                                    <div class="card-body p-4 p-md-5">
                                        <h3 class="mb-4 pb-2 pb-md-0 mb-md-5">Registration Form</h3>
                                        <form>
                                            <div class="row">
                                                <div data-mdb-input-init class="form-outline">
                                                    <input type="tel" id="username"
                                                        class="form-control form-control-lg" />
                                                    <label class="form-label" for="username">Username</label>
                                                </div>
                                                <div data-mdb-input-init class="form-outline">
                                                    <input type="tel" id="password"
                                                        class="form-control form-control-lg" />
                                                    <label class="form-label" for="password">Password</label>
                                                </div>
                                                <div data-mdb-input-init class="form-outline">
                                                    <input type="tel" id="confirmPassword"
                                                        class="form-control form-control-lg" />
                                                    <label class="form-label"
                                                        for="confirmPassword">confirmPassword</label>
                                                </div>
                                            </div>
                                            <button class="btn btn-primary btn-lg" type="button"
                                                onclick="register()">Register</button>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
                <div class="carousel-caption d-none d-md-block">
                </div>
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleDark" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
        </button>
    </div>
    <nav class="navbar navbar-expand-lg bg-light"></nav>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        function register() {
            // Lấy giá trị từ các thẻ input
            const firstName = document.getElementById('firstName').value;
            const lastName = document.getElementById('lastName').value;
            const birthdayDate = document.getElementById('birthdayDate').value;
            const emailAddress = document.getElementById('emailAddress').value;
            const phoneNumber = document.getElementById('phoneNumber').value;
            const address = document.getElementById('address').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const gender = document.querySelector('input[name="inlineRadioOptions"]:checked').value;

            if (password !== confirmPassword) {
                alert("Password and Confirm Password are not the same");
                return;
            }

            const fulname = firstName + " " + lastName;
            const birthDate = new Date(birthdayDate); // Chuyển đổi ngày sinh thành đối tượng Date
            const currentDate = new Date(); // Lấy ngày hiện tại
            let age = currentDate.getFullYear() - birthDate.getFullYear(); // Tính sự khác biệt về năm


            const new_customer = {
                full_name: fulname,
                age: age,
                sex: gender,
                email: emailAddress,
                phonenumber: phoneNumber,
                address: address,
                date_of_birth: birthdayDate,
                create_date: currentDate,
                category: 1
            }

            const new_customer_login = {
                customer: new_customer,
                username: username,
                password: password
            }

            console.log(new_customer_login);

            fetch('/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json',
                },
                body: JSON.stringify(new_customer_login)
            })
                .then(response => {
                    if (!response.ok) {
                        return response.text().then(message => {
                            throw new Error(message);
                        });
                    }
                    return response.json();
                })
                .then(data => {
                    console.log(data);

                    // Chuyển hướng người dùng đến trang đăng nhập
                    window.location.href = '/login';  // Địa chỉ trang đăng nhập của bạn
                })
                .catch(error => {
                    console.log("Lỗi", error.message);
                    alert(`ERROR!!!`);
                })


        }



    </script>
</body>

</html>
