<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>SoftGym Notifications</title>
    <style>
        .notification-icon {
            position: relative;
            cursor: pointer;
        }

        .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            color: white;
            border-radius: 50%;
            padding: 3px 6px;
            font-size: 0.7rem;
            display: none;
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img src="https://via.placeholder.com/110x50" alt="SoftGym Logo">
                </a>
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a href="#" class="nav-link">Lịch tập</a></li>
                        <li class="nav-item"><a href="#" class="nav-link">Đặt hàng</a></li>
                        <li class="nav-item"><a href="#" class="nav-link">Lịch trình</a></li>
                    </ul>
                </div>

                <div class="d-flex align-items-center">
                    <button class="nav-item btn btn-outline-dark ms-2 notification-icon" data-bs-toggle="modal"
                        data-bs-target="#notificationModal" type="button">
                        <i class="bi bi-bell"></i> <span class="notification-badge" id="notificationBadge"></span>
                    </button>
                    <button class="nav-item btn btn-outline-dark ms-2">
                        <i class="bi bi-person-circle"></i> Login
                    </button>
                </div>

            </div>
        </nav>
    </header>

    <div class="modal fade" id="notificationModal" tabindex="-1" aria-labelledby="notificationModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="notificationModalLabel">Thông báo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="list-group" id="notificationList"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const notificationBadge = document.getElementById('notificationBadge');
            const notificationList = document.getElementById('notificationList');
            const notificationModal = document.getElementById('notificationModal');

            const staffId = document.querySelector('meta[name="staffId"]').getAttribute('content'); 

            function fetchNotifications() {
                fetch(`/api/notifications/${staffId}`)
                    .then(response => response.json())
                    .then(notifications => {
                        notificationList.innerHTML = '';
                        let unreadCount = 0;
                        notifications.forEach(notification => {
                            const listItem = document.createElement('a');
                            listItem.href = "#";
                            listItem.classList.add('list-group-item', 'list-group-item-action');
                            listItem.textContent = notification.message;


                            if (!notification.read) {
                                unreadCount++;
                                listItem.classList.add('fw-bold');

                                // Add a click event listener for marking as read.
                                listItem.addEventListener('click', () => {
                                    markAsRead(notification.id, listItem);
                                })
                            }
                            notificationList.appendChild(listItem);
                        });


                        if (unreadCount > 0) {
                            notificationBadge.style.display = 'inline-block';
                            notificationBadge.textContent = unreadCount;
                        }
                        else {
                            notificationBadge.style.display = 'none';
                        }
                    })
                    .catch(error => console.error('Error fetching notifications:', error));
            }

            function markAsRead(notificationId, listItem) {
                fetch(`/api/notifications/mark-read/${notificationId}`, {
                    method: 'POST'
                })
                    .then(response => {
                        if (response.ok) {
                            listItem.classList.remove('fw-bold');
                            let currentCount = parseInt(notificationBadge.textContent)
                            if (currentCount > 1) {
                                notificationBadge.textContent = currentCount - 1;
                            } else {
                                notificationBadge.style.display = 'none';
                            }
                        }
                        else {
                            console.error('Failed to mark notification as read.')
                        }
                    })
                    .catch(error => {
                        console.error('Error marking notification as read: ', error)
                    })
            }


            fetchNotifications();

            notificationModal.addEventListener('show.bs.modal', () => {
                 fetchNotifications();
            });
        });
    </script>
</body>

</html>
