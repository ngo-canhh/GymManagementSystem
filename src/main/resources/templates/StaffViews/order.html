<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/StaffViewsCss/order-manage.css" />
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container">
                <a class="navbar-brand" href="/staff/schedule">
                    <img src="/images/SOFTGYM.jpg" alt="SoftGym Logo" width="110" height="50">
                </a>
                <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item"><a href="/admin/service" class="nav-link">Dịch vụ</a></li>
                        <li class="nav-item"><a href="/admin/customer" class="nav-link active">Khách hàng</a></li>
                        <li class="nav-item"><a href="/admin/staff" class="nav-link">Nhân viên</a></li>
                        <li class="nav-item"><a href="/admin/equipment" class="nav-link">Thiết bị</a></li>
                        <li class="nav-item"><a href="/admin/product" class="nav-link">Sản phẩm</a></li>
                        <li class="nav-item"><a href="/admin/pt" class="nav-link">Huấn luyện viên</a></li>
                        <li class="nav-item"><a href="#" class="nav-link">Doanh số</a></li>
                        <li class="nav-item"><a href="/makeOrder" class="nav-link">Tạo đơn</a></li>
                    </ul>
                </div>

                <!-- <button class="nav-item btn btn-outline-dark ms-2">
                    <i class="bi bi-person-circle"></i> Login
                </button> -->
                <ul class="navbar-nav" sec:authorize="isAuthenticated()">
                    <li class="nav-item dropdown">
                        <a class="nav-link ms-3 user-info" href="#" id="navbarDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="username btn btn-info" th:text="${#authentication.name}"></span>
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li><a class="dropdown-item" href="/">Trang chủ</a></li>
                            <li><a class="dropdown-item" href="/admin/service"
                                    sec:authorize="hasAnyAuthority('ADMIN')">Trang ADMIN</a></li>

                            <li><a class="dropdown-item" href="/logout">Đăng xuất</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="#">Danh sách nhà cung cấp</a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
    </header>
    <div id="order-container">
        <div id="form-wrapper">
            <!-- Invoice Details -->
            <form class="form-section" id="invoice-details">
                <h2>Invoice Details</h2>
                <div class="field-row">
                    <label for="order-date">Date: </label>
                    <input type="date" id="order-date" th:value="${date}" readonly required />
                </div>
                <div class="field-row">
                    <label for="customer">Customer: </label>
                    <select id="customer"></select>
                </div>
                <div class="field-row">
                    <label for="customer-id">Customer Id: </label>
                    <input type="number" id="customer-id" />
                </div>
                <div class="field-row">
                    <label for="customer-name">Name: </label>
                    <input type="text" id="customer-name" />
                </div>
                <div class="field-row">
                    <label for="customer-salary">Salary: </label>
                    <input type="text" id="customer-salary" />
                </div>
                <div class="field-row">
                    <label for="customer-address">Address: </label>
                    <input type="text" id="customer-address" />
                </div>
            </form>

            <!-- Item Select -->
            <form class="form-section" id="item-select">
                <h2>Item Select</h2>
                <div class="field-row">
                    <label for="item">Item: </label>
                    <input type="text" id="item-name" required />
                </div>
                <div class="field-row">
                    <label for="item-code">Item Code: </label>
                    <input type="number" id="item-code" required />
                </div>
                <div class="field-row">
                    <label for="price">Price: </label>
                    <input type="number" id="price" readonly required />
                </div>
                <div class="field-row">
                    <label for="ordered-qty">Ordered Quantity: </label>
                    <input type="number" id="quantity" required />
                </div>
                <button class="red-btn" id="add-item">Add Item</button>
            </form>

            <!-- Purchase Details -->
            <form class="form-section" id="purchase-details">
                <h2>Purchase Details</h2>
                <div class="field-row">
                    <label for="discount">Discount: </label>
                    <input type="number" id="discount" value="0" required readonly />
                </div>
                <div class="field-row">
                    <label for="balance">Balance: </label>
                    <input type="number" id="balance" readonly />
                </div>
                <div class="field-row">
                    <label for="staff">ID Staff: </label>
                    <input type="number" id="staff-id" th:value="${staffId}" required readonly />
                </div>
                <div class="balance-row">
                    <label>Total: </label>
                    <span id="total">000 VND</span>
                </div>
                <div class="button-container">
                    <style>
                        .button-container {
                            display: flex;
                            /* Đặt các button trong cùng một hàng ngang */
                            justify-content: space-between;
                            /* Điều chỉnh khoảng cách giữa các button */
                            gap: 10px;
                            /* Khoảng cách giữa các button */
                        }

                        .green-btn {
                            flex: 1;
                            /* Bạn có thể chọn điều chỉnh các button này theo kích thước bạn muốn */
                        }
                    </style>
                    <button class="green-btn" id="btn-purchase">Thanh toán bằng tiền mặt</button>
                    <button class="green-btn mt-2 pt-2" id="btn-purchase-card">Thanh toán bằng thẻ</button>
                </div>

            </form>
        </div>

        <div id="table-wrapper">
            <table id="added-item">
                <thead>
                    <tr>
                        <th>Item Id</th>
                        <th>Item-Name</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Remove</th>
                    </tr>
                </thead>
                <tbody>

                </tbody>
            </table>
        </div>
    </div>
</body>
<script src="/js/make_order.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"></script>

</html>
